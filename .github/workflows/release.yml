name: Release

on:
  # Deliberately main-only. merge-back pushes main into beta as the release
  # App, and App-token pushes trigger workflows, so a `beta` push trigger made
  # every merge-back cut a prerelease of main's own commits. Those release
  # commits rewrite the same CHANGELOG.md and src/core/__version__.py lines
  # main rewrites, so the next merge-back conflicted — v1.1.4-beta.1 and PR
  # #141 were exactly that loop. Cut beta prereleases from the manual trigger
  # instead, which is a deliberate act rather than a side effect of syncing.
  push:
    branches:
      - main
  # Weekly roll-up of the fix(deps) commits that .releaserc.js suppresses on
  # push, promoted into a single patch release. GitHub only fires schedule
  # from the default branch, so this sweeps main only; use the manual trigger
  # below to sweep beta.
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — weekly dependency roll-up
  # Run against the beta ref to cut a prerelease; this is now beta's only
  # release path. Also sets RELEASE_DEPS, so such a run doubles as an
  # on-demand dependency sweep (the only way to promote suppressed fix(deps)).
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jabrown93/ci/.github/workflows/docker-release.yml@b70e41bf036b757899993918c1788f38c3c472fc # workflows-v3.0.0
    permissions:
      contents: write
    with:
      # .releaserc.js's @semantic-release/exec plugin isn't in the action's
      # bundled set (commit-analyzer/release-notes-generator/changelog/git/github).
      extra-plugins: |
        @semantic-release/exec@7
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  image:
    name: Build & push image
    needs: release
    # Must stay in THIS repo's own workflow file, not inside docker-release.yml
    # (a public reusable workflow every jabrown93 repo calls): cosign's keyless
    # signing asks Fulcio for a cert whose SAN is the OIDC identity of the
    # workflow FILE that requested the token. Running the build/push/sign step
    # here makes that SAN this repo's own path, which is what Kyverno's
    # verify-ghcr-images policy trusts -- inside docker-release.yml every
    # caller would get the identical jabrown93/ci SAN instead.
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: jabrown93/ci/actions/docker-image@3b3f9d74d9c06b48e8f7e1cc9ae8bacf927ca1b4 # docker-image-v1.0.0
        with:
          image: ghcr.io/jabrown93/artwork-uploader
          version: ${{ needs.release.outputs.version }}
          channel: ${{ needs.release.outputs.channel }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
